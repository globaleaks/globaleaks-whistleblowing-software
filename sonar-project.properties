# Scope of the SonarQube analysis.
#
# The rules turned off here are the ones that, in the version of the analysers
# the instance runs, contradict the language, the framework or the addresses
# reserved for documentation. Every issue they raise on this project is one of
# those cases, and each is listed with the reason it is not a defect.
#
# python:S2712 - "Use only return or only yield, not both".
# Every function the rule reports is a Twisted @inlineCallbacks generator, and
# the value of its deferred is returned exactly this way: since PEP 380 a
# generator returns a value through a return statement, and the rule predates
# it.
#
# python:S1313 - "Make this IP address configurable".
# Every address the rule reports is the loopback the services bind to, the
# wildcard address, or one of the ranges reserved for documentation and for
# private use that the tests name as fixtures (RFC 5737, RFC 3849, RFC 1918).
# None of them is reachable from a network. The rule is turned off on the tests
# and on the files that bind the loopback, and stays on everywhere else.
#
# javascript:S2819 - "Make sure this cross-domain message is being sent to the
# intended domain". The attachment viewer runs in a sandboxed frame whose
# origin is opaque, so it cannot name the origin of the page that embeds it;
# the message it posts carries no more than the word saying that it is ready,
# and the messages it accepts are only the ones the embedding frame sends.

sonar.issue.ignore.multicriteria=inlinecallbacks,reserved_addresses_tests,reserved_addresses_https,reserved_addresses_state,reserved_addresses_oidc,reserved_addresses_sni,reserved_addresses_tls,viewer_ready

sonar.issue.ignore.multicriteria.inlinecallbacks.ruleKey=python:S2712
sonar.issue.ignore.multicriteria.inlinecallbacks.resourceKey=**/*.py

sonar.issue.ignore.multicriteria.reserved_addresses_tests.ruleKey=python:S1313
sonar.issue.ignore.multicriteria.reserved_addresses_tests.resourceKey=backend/globaleaks/tests/**/*.py

sonar.issue.ignore.multicriteria.reserved_addresses_https.ruleKey=python:S1313
sonar.issue.ignore.multicriteria.reserved_addresses_https.resourceKey=backend/globaleaks/handlers/admin/https.py

sonar.issue.ignore.multicriteria.reserved_addresses_state.ruleKey=python:S1313
sonar.issue.ignore.multicriteria.reserved_addresses_state.resourceKey=backend/globaleaks/state.py

sonar.issue.ignore.multicriteria.reserved_addresses_oidc.ruleKey=python:S1313
sonar.issue.ignore.multicriteria.reserved_addresses_oidc.resourceKey=backend/globaleaks/utils/oidc.py

sonar.issue.ignore.multicriteria.reserved_addresses_sni.ruleKey=python:S1313
sonar.issue.ignore.multicriteria.reserved_addresses_sni.resourceKey=backend/globaleaks/utils/sni.py

sonar.issue.ignore.multicriteria.reserved_addresses_tls.ruleKey=python:S1313
sonar.issue.ignore.multicriteria.reserved_addresses_tls.resourceKey=backend/globaleaks/utils/tls.py

sonar.issue.ignore.multicriteria.viewer_ready.ruleKey=javascript:S2819
