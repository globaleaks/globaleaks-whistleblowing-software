@if (sortBy) {
  <span class="sortable" (click)="state.toggleSort(sortBy)">
    <ng-container *ngTemplateOutlet="name"></ng-container>
    @if (state.orderBy !== sortBy) {
      <i class="fa-solid fa-sort text-muted ms-1" aria-hidden="true"></i>
    } @else if (state.orderDesc) {
      <i class="fa-solid fa-sort-down ms-1" aria-hidden="true"></i>
    } @else {
      <i class="fa-solid fa-sort-up ms-1" aria-hidden="true"></i>
    }
  </span>
} @else {
  <ng-container *ngTemplateOutlet="name"></ng-container>
}
<ng-template #name>
  @if (icon) {
    <i class="fa-solid {{ icon }}" aria-hidden="true"></i>
  }
  <span [class.visually-hidden]="labelHidden">{{ label }}</span>
</ng-template>
@if (filterType === 'select') {
  <span class="dropdown-multi-select-container ms-1" (click)="$event.stopPropagation()">
    <i class="fa-solid fa-filter" [attr.id]="'filter-' + filter" [ngClass]="{ 'filter-active': state.isFiltered(filter) }" (click)="state.toggleFilter(filter);$event.stopPropagation();"></i>
    <span [class.d-none]="state.openFilter !== filter" (click)="$event.stopPropagation()">
      <ng-multiselect-dropdown [class.dropdown-visible]="state.openFilter === filter" [settings]="dropdownSettings" [data]="options" [ngModel]="state.selections[filter]" (ngModelChange)="state.setSelection(filter, $event)"></ng-multiselect-dropdown>
    </span>
  </span>
}
@if (filterType === 'daterange') {
  <span class="ngb-datepicker-container ms-1" (click)="$event.stopPropagation()">
    <i class="fa-solid fa-calendar" [attr.id]="'filter-' + filter" [ngClass]="{ 'filter-active': state.isFiltered(filter) }" (click)="state.toggleFilter(filter);$event.stopPropagation();"></i>
    <div [hidden]="state.openFilter !== filter" (click)="$event.stopPropagation()">
      <src-date-selector class="position-absolute d-block" [currentDates]="null" (emitDateSelection)="state.setRange(filter, $event)"></src-date-selector>
    </div>
  </span>
}
