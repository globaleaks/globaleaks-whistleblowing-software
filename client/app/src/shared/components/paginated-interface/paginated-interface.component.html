-<!-- Filtering bar -->
<div class="row mb-3">
  <div class="col d-flex align-items-center gap-3 justify-content-start">
    <app-search-input
      class="flex-shrink-0"
      [(value)]="searchText"
      (valueChange)="update()">
    </app-search-input>

    <div class="form-check m-0 d-flex align-items-center" *ngIf="filterOptFn">
      <input
        class="form-check-input mt-0"
        type="checkbox"
        id="filterOpt"
        [(ngModel)]="filterOptEnabled"
        (ngModelChange)="update()"
      >
      <label class="form-check-label ms-2 mb-0" for="filterOpt">{{filterOptLabel}}</label>
    </div>
  </div>
</div>

<!-- SIMPLE MODE -->
<div *ngIf="mode === 'simple' && content" class="row">
  <ng-container
    *ngFor="let item of paginatedItems; let i = index"
    [ngTemplateOutlet]="content"
    [ngTemplateOutletContext]="{ item: item, index: i }">
  </ng-container>
</div>

<!-- TABLE MODE -->
<table *ngIf="mode === 'table' && header && content" class="table table-striped w-100">
  <thead>
    <ng-container [ngTemplateOutlet]="header"></ng-container>
  </thead>
  <tbody>
    <ng-container
      *ngFor="let item of paginatedItems; let i = index"
      [ngTemplateOutlet]="content"
      [ngTemplateOutletContext]="{ item: item, index: i }">
    </ng-container>
  </tbody>
</table>

<!-- Pagination -->
<app-pagination
  [items]="filteredItems"
  [(currentPage)]="currentPage"
  [itemsPerPage]="itemsPerPage"
  (currentPageChange)="update()">
</app-pagination>
