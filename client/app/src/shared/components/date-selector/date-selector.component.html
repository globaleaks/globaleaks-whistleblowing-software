<div class="ngb-datepicker-container-inner">
    <ngb-datepicker class="bg-white" (dateSelect)="onDateSelection($event)" [displayMonths]="1" [dayTemplate]="t" outsideDays="hidden"></ngb-datepicker>
    <ng-template #t let-date let-focused="focused">
        <span class="custom-date-selector" [class.focused]="focused" [class.range]="isRange(date)" [class.faded]="isHovered(date) || isInside(date)" (mouseenter)="hoveredDate = date" (mouseleave)="hoveredDate = null">
            {{ date.day }}
        </span>
    </ng-template>
</div>
<!-- The dates apply as soon as the range is whole: saving closes the calendar, which otherwise its icon does -->
<div class="position-absolute bottom-0 start-0 m-2 d-flex gap-2">
    <button type="button" class="btn btn-primary" (click)="closed.emit()">{{ 'Save' | translate }}</button>
    <button type="button" class="btn btn-outline-danger" (click)="resetDatepicker()">{{ 'Reset' | translate }}</button>
</div>
