@if (items().length > itemsPerPage()) {
<div class="text-center">
  <ngb-pagination
    dir="ltr"
    class="d-flex justify-content-center"
    [(page)]="currentPage"
    (pageChange)="onPageChange($event)"
    [pageSize]="itemsPerPage()"
    [collectionSize]="items().length">

    <ng-template ngbPaginationFirst>
      <span ngbTooltip="{{ 'First' | translate }}">
        <i class="fas fa-backward-fast" aria-hidden="true"></i>
      </span>
    </ng-template>

    <ng-template ngbPaginationPrevious>
      <span ngbTooltip="{{ 'Previous' | translate }}">
        <i class="fas fa-backward-step" aria-hidden="true"></i>
      </span>
    </ng-template>

    <ng-template ngbPaginationNext>
      <span ngbTooltip="{{ 'Next' | translate }}">
        <i class="fas fa-forward-step" aria-hidden="true"></i>
      </span>
    </ng-template>

    <ng-template ngbPaginationLast>
      <span ngbTooltip="{{ 'Last' | translate }}">
        <i class="fas fa-forward-fast" aria-hidden="true"></i>
      </span>
    </ng-template>
  </ngb-pagination>
</div>
}
