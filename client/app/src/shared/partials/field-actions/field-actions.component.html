@if (held) {
  <button type="button" class="field-action config-reset-btn" [ngbTooltip]="'Reset' | translate" [attr.aria-label]="'Reset' | translate" (click)="reset()">
    <i class="fas fa-rotate-left" aria-hidden="true"></i>
  </button>
}
@if (lockShown) {
  <button type="button" class="field-action key-lock-btn" [class.field-action--off]="customizable" [attr.aria-pressed]="!customizable" [ngbTooltip]="(customizable ? 'Customizable' : 'Not customizable') | translate" [attr.aria-label]="(customizable ? 'Customizable' : 'Not customizable') | translate" (click)="toggleLock()">
    <i class="fas fa-lock" aria-hidden="true"></i>
  </button>
}
