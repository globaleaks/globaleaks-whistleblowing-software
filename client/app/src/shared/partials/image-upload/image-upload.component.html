<form action="">
  <div class="image-upload">
    <ng-container #flowAdvanced="flow" flowDrop [flowConfig]="flowConfig"></ng-container>
    <input #uploader id="projectImageLoader" (change)="onFileSelected(uploader.files)" type="file" flowButton [style.display]="'none'" [flowAttributes]="{ accept: 'image/*' }" />
    @if (!imageUploadModel[imageUploadModelAttr]) {
      <label for="projectImageLoader" class="change-picture-button text-primary" ngbTooltip="{{'Edit' | translate}}" (click)="triggerFileInputClick()" (keydown.enter)="triggerFileInputClick()" tabindex="0" role="button">
        <i class="fas fa-pen-to-square"></i>
      </label>
    }
    @if (imageUploadModel[imageUploadModelAttr] || imageUploadObj.files.length) {
      <button type="button" [attr.id]="'projectImageLoader'" class="change-picture-button text-danger icon-action" (click)="deletePicture()" ngbTooltip="{{'Delete' | translate}}">
        <i class="fas fa-xmark"></i>
      </button>
    }
    <div>
      @if (filemodel) {
        <img class="logo-image" alt="image" src="s/{{imageUploadId}}?timestamp={{getCurrentTimestamp()}}" />
      }
      @if (!filemodel) {
        <div class="logo-image-empty"></div>
      }
    </div>
  </div>
</form>
