<div srcCollapsiblePanel id="TipPageReceiversInfoBox" class="card card-default" [collapsed]="collapsed" [label]="'Recipients' | translate" (toggled)="toggleCollapse()">
  @if (!collapsed) {
    <div class="card-body">
      @for (receiver of tipService().tip.receivers | filter : 'active' : true; track receiver) {
        <div>
          <div>{{tipService().tip.receivers_by_id[receiver.id]?.name | translate}}</div>
        </div>
      }
    </div>
  }
</div>
