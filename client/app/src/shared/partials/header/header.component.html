<header id="HeaderBox" class="p-3">
  <div class="d-flex flex-wrap justify-content-between">
    <div id="HeaderBox1">
      <!-- A link to the home page: named by the title of the site, or by the page it opens where the site has none -->
      <a id="LogoBox" class="mb-3" href="/" (click)="$event.preventDefault(); appConfig.setHomepage()">
        <img class="img-fluid" [alt]="appDataService.projectTitle" src="s/logo" />
      </a>
      <div id="TitleBox">
        @if (appDataService.projectTitle || appDataService.pageTitle) {
          <h1>
            @if (appDataService.projectTitle) {
              <a id="ProjectTitle" href="/" (click)="$event.preventDefault(); appConfig.setHomepage()">{{appDataService.projectTitle}}</a>
            }
            @if (appDataService.projectTitle && appDataService.pageTitle) {
              <span class="TitleSeparator"> - </span>
            }
            <span id="PageTitle">{{appDataService.pageTitle ? appDataService.pageTitle : '' | translate}}</span>
          </h1>
        }
      </div>
    </div>
    <div id="HeaderBox2">
      <src-user id="UserBox"></src-user>
    </div>
  </div>
</header>
