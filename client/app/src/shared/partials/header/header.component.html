<header id="HeaderBox" class="p-3">
  <div class="d-flex flex-wrap justify-content-between">
    <div id="HeaderBox1">
      <div id="LogoRow" class="d-flex align-items-center gap-2 mb-3">
        <!-- A link to the home page: named by the title of the site, or by the page it opens where the site has none -->
        <a id="LogoBox" href="/" (click)="$event.preventDefault(); appConfig.setHomepage()">
          <!-- A logo of the site made for the light theme stands in the dark one on a light ground -->
          <img class="img-fluid" [class.logo-on-light]="themeService.theme() === 'dark' && appDataService.public.node.logo && !appDataService.public.node.logo_dark" [alt]="appDataService.projectTitle" [src]="themeService.theme() === 'dark' ? 's/logo-dark' : 's/logo'" />
        </a>
      </div>
      <div id="TitleBox">
        @if (appDataService.projectTitle || appDataService.pageTitle) {
          <h1>
            @if (appDataService.projectTitle) {
              <a id="ProjectTitle" href="/" (click)="$event.preventDefault(); appConfig.setHomepage()">{{appDataService.projectTitle}}</a>
            }
            @if (appDataService.projectTitle && appDataService.pageTitle) {
              <span class="TitleSeparator"> - </span>
            }
            <span id="PageTitle">{{appDataService.pageTitle ? appDataService.pageTitle : '' | translate}}</span>
          </h1>
        }
      </div>
    </div>
    <div id="HeaderBox2" class="d-flex align-items-start gap-2">
      <src-user id="UserBox" [navItems]="navItems()"></src-user>
    </div>
  </div>
</header>
