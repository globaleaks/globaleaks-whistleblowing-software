<div srcCollapsiblePanel id="TipInfoBox" class="card card.bg-primary" [collapsed]="collapsed" [chevron]="false" [label]="'Additional questionnaire' | translate" (toggle)="toggleColLapse()">
  @if (!collapsed) {
    <div class="card-body d-flex justify-content-between">
      <div>{{'It is requested to fill an additional questionnaire'|translate}}</div>
      <div class="">
        @if (askedByViewer()) {
          <button class="btn btn-primary" id="edit_additional_questionnaire" (click)="edit.emit()">
            <i class="fas fa-pen"></i>
            <span>{{'Edit'|translate}}</span>
          </button>
        } @else {
          <button class="btn btn-primary" id="open_additional_questionnaire" (click)="tipOpenAdditionalQuestionnaire()">
            <i class="fas fa-check"></i>
            <span>{{'Fill the additional questionnaire'|translate}}</span>
          </button>
        }
      </div>
    </div>
  }
</div>
