<div class="row">
  <div class="col-md-12">
    <div>
      <span class="badge bg-primary">1</span>
      <span>{{'Install an authenticator app on your phone'|translate}}</span>
    </div>
  </div>
</div>
<div class="row mt-3">
  <div class="col-md-12">
    <div>
      <div>
        <span class="badge bg-primary">2</span>
        <span>{{'Scan the QR code with the app'|translate}}</span>
      </div>
      <br />
      <div class="text-center">
        <qrcode ngbTooltip="{{'Copy to clipboard' | translate}}" (click)="utils.copyToClipboard(twoFactorAuthData.totp.secret);" [qrdata]="twoFactorAuthData.totp.qrcode_string" [width]="350" [errorCorrectionLevel]="'Q'" [colorDark]="'#1d1f2a'" [colorLight]="'#fff'"></qrcode>
        <div class="form-group d-block mx-auto">
          <label for="otp-secret-input" class="visually-hidden">{{'2FA'}}</label>
          <input id="otp-secret-input" class="form-control mx-auto" name="secret" [ngModel]="twoFactorAuthData.totp.secret" [ngModelOptions]="{standalone: true}" type="text" size="32" readonly disabled />
        </div>
      </div>
    </div>
  </div>
</div>
<div class="row mt-3">
  <div class="col-md-12">
    <div class="form-group">
      <label for="otp-token-input">
        <span class="badge bg-primary">3</span>
        <span>{{'Enter the two factor authentication code'|translate}}</span>
      </label>
      <input id="otp-token-input" class="form-control" [(ngModel)]="twoFactorAuthData.totp.token" type="password" size="6" maxlength="6" />
    </div>
  </div>
</div>
