<label>{{ adminFile().title }}</label>
<div class="uploadfile" [class]="'file-' + adminFile().varname">
  <span>
    @if (!present()) {
    <input #uploader [attr.id]="'customFile-' + adminFile().varname" type="file" flowButton [style.display]="'none'" (change)="onFileSelected(uploader.files, adminFile().varname)" />
    <button type="button" class="btn btn-sm btn-primary" (click)="uploader.click()">
      <i class="fas fa-upload" aria-hidden="true"></i>
      <span>{{ 'Upload' | translate }}</span>
    </button>
    }
    @if (present()) {
      <a class="btn btn-sm btn-primary" [href]="'s/' + adminFile().varname" [download]="adminFile().filename">
        <i class="fas fa-download"></i>
        <span>{{ 'Download' | translate }}</span>
      </a>
      <button class="btn btn-sm btn-danger" (click)="deleteFile('api/admin/files/' + adminFile().varname)">
        <i class="fas fa-trash"></i>
        <span>{{ 'Delete' | translate }}</span>
      </button>
    }
  </span>
</div>
