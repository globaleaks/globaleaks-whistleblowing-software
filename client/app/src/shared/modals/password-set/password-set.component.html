<div class="modal-header">
  <h5 id="modal-title" class="modal-title">{{'Reset password'|translate}}</h5>
  <button type="button" class="btn-close" (click)="dismiss()" [attr.aria-label]="'Close' | translate"><i class="fa-solid fa-circle-xmark" aria-hidden="true"></i></button>
</div>
<div class="modal-body">
  <div id="NewPassword" class="text-center font-weight-bold" ngbTooltip="{{'Copy to clipboard' | translate}}" (click)="utilsService.copyToClipboard(password)">
    <b>{{password}}</b></div>
  <br/>
</div>
<div class="modal-footer">
  <button (click)="dismiss()" id="close" class="btn btn-outline-secondary">{{'Close'|translate}}</button>
</div>
