<div class="modal-header">
  <h5 id="modal-title" class="modal-title">{{ 'Mask' | translate }}</h5>
  <button type="button" class="btn-close" (click)="cancel()" [attr.aria-label]="'Close' | translate"><i class="fa-solid fa-circle-xmark" aria-hidden="true"></i></button>
</div>

<div class="modal-body">
  <label for="redact" class="visually-hidden">{{ 'Content' | translate }}</label>
  <textarea #redact id="redact" name="controlElement" [ngModel]="forced_visible ? unmaskedContent : content" (ngModelChange)="forced_visible ? unmaskedContent : content = $event" cols="30"
  rows="10" (keydown)="ignoreEdit($event)" (select)="updateSelection()" (selectionchange)="updateSelection()" (click)="updateSelection()" (keyup)="updateSelection()" class="form-control"></textarea>
</div>

<div class="modal-footer">
  <!-- Save and Cancel first, as everywhere; Delete last -->
  <button class="btn btn-primary" id="save_masking" type="button" (click)="saveMasking()" [disabled]="!changed">
    <span>{{ 'Save' | translate }}</span>
  </button>

  <button class="btn btn-outline-secondary" id="modal-action-cancel" type="button" (click)="cancel()">
    <span>{{ 'Cancel' | translate }}</span>
  </button>

  <button id="toggle-button" (click)="toggleVisibility()" class="btn" type="button" [attr.aria-label]="'Toggle visibility' | translate">
    @if (forced_visible) {
      <span id="eye-icon-open"><i class="fa-solid fa-eye" aria-hidden="true"></i></span>
    }
    @if (!forced_visible) {
      <span id="eye-icon-closed"><i class="fa-solid fa-eye-slash" aria-hidden="true"></i></span>
    }
  </button>

  @if (preferenceResolver.dataModel.can_mask_information) {
    <button class="btn btn-outline-secondary" id="mask_content" type="button" (click)="hideContent()" [disabled]="!can_hide">
      <span>{{ 'Mask' | translate }}</span>
    </button>

    <button class="btn btn-outline-secondary" id="unmask_content" type="button" (click)="unhideContent()" [disabled]="!can_unhide">
      <span>{{ 'Show' | translate }}</span>
    </button>
  }

  @if (preferenceResolver.dataModel.can_redact_information) {
    <button class="btn btn-outline-danger" id="redact_content" type="button" (click)="deleteContent()" [disabled]="!can_delete">
      <span>{{ 'Delete' | translate }}</span>
    </button>
  }
</div>
