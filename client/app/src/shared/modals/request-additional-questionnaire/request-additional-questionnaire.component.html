<div class="modal-header">
  <h5 id="modal-title" class="modal-title">{{'Additional questionnaire'|translate}}</h5>
  <button type="button" class="btn-close" (click)="cancel()" [attr.aria-label]="'Close' | translate"><i class="fa-solid fa-circle-xmark" aria-hidden="true"></i></button>
</div>
<div class="modal-body">
  <div id="AdditionalQuestionnaireSelector" class="form-group">
    <label for="request-additional-questionnaire-select">{{'Select' | translate}}</label>
    <ng-select id="request-additional-questionnaire-select" class="w-50 rounded-end-0" [attr.data-cy]="'questionnaire_selection'" [(ngModel)]="questionnaire" [items]="selectableQuestionnaires" bindLabel="name" placeholder="{{ 'Search' | translate }}" [searchable]="true" [clearable]="true" [ariaLabel]="'Select' | translate">
      <ng-template ng-label-tmp let-item="item">{{ item.name }}</ng-template>
    </ng-select>
  </div>
</div>
<div class="modal-footer">
  <button id="modal-action-ok" class="btn btn-primary" [disabled]="!hasDecision()" (click)="confirm()">
    <span>{{'Confirm'|translate}}</span>
  </button>
  <a id="modal-action-cancel" class="btn btn-outline-secondary" (click)="cancel()" (keydown.enter)="cancel()" tabindex="0" role="button">
    <i class="fas fa-xmark" aria-hidden="true"></i>
    <span>{{'Close'|translate}}</span>
  </a>
</div>
