<div class="modal-header">
  <h5 id="modal-title" class="modal-title">{{ 'Access code' | translate }}</h5>
  <button type="button" class="btn-close" (click)="dismiss()" [attr.aria-label]="'Close' | translate"><i class="fa-solid fa-circle-xmark" aria-hidden="true"></i></button>
</div>
<div class="modal-body">
  <div class="form-group receipt-input">
    <div class="input-group">
      <input id="AccessCode" dir="ltr" class="form-control receipt-code" type="text" maxlength="19" size="19" [value]="formattedCode" readonly [attr.aria-label]="'Access code' | translate">
      <button id="AccessCodeCopyButton" (click)="utilsService.copyToClipboard(code)" class="btn btn-primary m-0 rounded-start-0" type="button" ngbTooltip="{{ 'Copy to clipboard' | translate }}" [attr.aria-label]="'Copy to clipboard' | translate">
        <i class="fa-solid fa-copy"></i>
      </button>
    </div>
  </div>
</div>
<div class="modal-footer">
  <button type="button" (click)="dismiss()" id="close" class="btn btn-outline-secondary">{{ 'Close' | translate }}</button>
</div>
