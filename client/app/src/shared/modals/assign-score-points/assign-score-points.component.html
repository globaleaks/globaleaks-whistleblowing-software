<div class="modal-header">
  <h5 id="modal-title" class="modal-title">{{ 'Assign score points' | translate }}</h5>
  <button type="button" class="btn-close" (click)="cancel()" [attr.aria-label]="'Close' | translate"><i class="fa-solid fa-circle-xmark" aria-hidden="true"></i></button>
</div>
<div class="modal-body">
  <div class="form-group">
    <label for="score_type">{{ 'Type' | translate }}</label>
    <select id="score_type" class="form-control" [(ngModel)]="arg.score_type">
      <option value="none">{{ 'None' | translate }}</option>
      <option value="addition">{{ 'Addition' | translate }}</option>
      <option value="multiplier">{{ 'Multiplier' | translate }}</option>
    </select>
  </div>
  @if (arg.score_type !== 'none') {
    <div class="form-group">
      <label for="score_points">{{ 'Value' | translate }}</label>
      <input id="score_points" class="form-control" [(ngModel)]="arg.score_points" type="number" />
    </div>
  }
</div>
  <div class="modal-footer">
    <a id="modal-action-ok" class="btn btn-primary" (click)="confirm()">
      <i class="fas fa-check" aria-hidden="true"></i>
      <span>{{ 'Confirm' | translate }}</span>
    </a>
    <a id="modal-action-cancel" class="btn btn-outline-secondary" (click)="cancel()">
      <i class="fas fa-xmark" aria-hidden="true"></i>
      <span>{{ 'Cancel' | translate }}</span>
    </a>
    <a id="modal-action-reset" class="btn btn-danger" (click)="arg.score_type = 'none'; arg.score_points = 0; cancel()">
      <i class="fas fa-check" aria-hidden="true"></i>
      <span>{{ 'Reset' | translate }}</span>
    </a>
  </div>
