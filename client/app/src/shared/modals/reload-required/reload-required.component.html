<div class="modal-header">
  <h5 class="modal-title">Update available</h5>
  <button type="button" class="btn-close" (click)="cancel()" [attr.aria-label]="'Close' | translate"><i class="fa-solid fa-circle-xmark" aria-hidden="true"></i></button>
</div>

<div class="modal-body">
  <p>The report has been updated. Refresh the page to fetch updates.</p>
</div>

<div class="modal-footer">
  <button class="btn btn-primary" (click)="confirm()">Refresh</button>
</div>
