<div class="modal-header">
  <h5 id="modal-title" class="modal-title">{{'Account recovery key'|translate}}</h5>
  <button type="button" class="btn-close" (click)="dismiss()" [attr.aria-label]="'Close' | translate"><i class="fa-solid fa-circle-xmark" aria-hidden="true"></i></button>
</div>
<div class="modal-body">
  <div class="input-group">
    <input id="AccountRecoveryKey" class="form-control text-center font-weight-bold" [type]="visible ? 'text' : 'password'" [value]="erk" readonly [attr.aria-label]="'Account recovery key' | translate">
    <button type="button" class="btn btn-outline-secondary" id="toggle-visibility" (click)="visible = !visible" ngbTooltip="{{(visible ? 'Hide' : 'Show') | translate}}" [attr.aria-label]="(visible ? 'Hide' : 'Show') | translate">
      @if (visible) {
        <i class="fas fa-eye" aria-hidden="true"></i>
      } @else {
        <i class="fas fa-eye-slash" aria-hidden="true"></i>
      }
    </button>
    <button type="button" class="btn btn-outline-secondary" id="copy-to-clipboard" (click)="utilsService.copyToClipboard(erk)" ngbTooltip="{{'Copy to clipboard' | translate}}" [attr.aria-label]="'Copy to clipboard' | translate">
      <i class="fas fa-copy" aria-hidden="true"></i>
    </button>
  </div>
  <br/>
  <div>{{'Make a copy and store it in a safe place. It will be necessary if you lose your password to recover the access to your account without data loss.'|translate}}</div>
</div>
<div class="modal-footer">
  <button (click)="dismiss()" id="close" class="btn btn-outline-secondary">{{'Close'|translate}}</button>
</div>
