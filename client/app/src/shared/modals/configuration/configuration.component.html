<div class="modal-header">
  <div>
    <h4 class="modal-title">{{ 'Configuration' | translate }}</h4>
  </div>
  <button type="button" class="btn-close" (click)="close()" [attr.aria-label]="'Close' | translate"><i class="fa-solid fa-circle-xmark" aria-hidden="true"></i></button>
</div>
<div class="modal-body">
  <div id="configuration-held">
    <div>{{ heldLabel | translate }}</div>
    <div class="configuration-list">
      <src-selection-editor
        [label]="heldLabel"
        [hideLabel]="true"
        [options]="[]"
        [selected]="held"
        [addable]="false"
        [givingUp]="true"
        [selectableDefault]="false"
        (entryRemoved)="giveUp($event.id)">
      </src-selection-editor>
    </div>
  </div>
  @if (isProfile) {
    <div id="configuration-customizable">
      <div>{{ customizableLabel | translate }}</div>
      <div class="configuration-list">
        <src-selection-editor
          [label]="customizableLabel"
          [hideLabel]="true"
          addButtonClass="add-configuration-btn"
          adderId="ConfigurationAdder"
          [options]="lockable"
          [selected]="customizable"
          [addable]="true"
          [givingUp]="false"
          [selectableDefault]="false"
          (entryAdded)="unlock($event)"
          (entryRemoved)="lock($event.id)">
        </src-selection-editor>
      </div>
    </div>
  }
</div>
