<div class="modal-header">
  <div class="modal-title">{{ 'Reporting person' | translate }}</div>
  <button type="button" class="btn-close" (click)="activeModal.dismiss()" [attr.aria-label]="'Close' | translate"><i class="fa-solid fa-circle-xmark" aria-hidden="true"></i></button>
</div>
<div class="modal-body">
  <src-tip-comments [tipService]="tipService" [key]="'public'"></src-tip-comments>
</div>
<div class="modal-footer">
  <button id="modal-action-cancel" class="btn btn-outline-secondary" (click)="activeModal.dismiss()">
    <i class="fas fa-times"></i>
    <span>{{'Close' | translate}}</span>
  </button>
</div>
