<div class="config-section reveal">
  @if (isAdmin) {
    <div class="form-group row align-items-center">
      <label class="col-auto col-form-label" for="default-statistical-template">{{ 'Default statistical template' | translate }}</label>
      <div class="col-md-4">
        <select id="default-statistical-template" name="default_statistical_template" class="form-control"
          [ngModel]="defaultTemplateId" (ngModelChange)="setDefaultTemplate($event)">
          @for (template of templatesData; track template.id) {
            <option [value]="template.id">{{ template.label }}</option>
          }
        </select>
      </div>
    </div>
  }
  <div>
    <span>{{ 'Templates' | translate }}</span>
    <button class="btn btn-sm btn-primary show-add-template-btn" (click)="toggleAddTemplate()">
      <i class="fas fa-plus"></i>
      <span>{{ 'Add' | translate }}</span>
    </button>
    <span class="custom-file">
      <input id="import-template-file" type="file" hidden #templateUploadInput (change)="importTemplate(templateUploadInput.files)" />
      <label for="import-template-file" class="btn btn-sm btn-outline-secondary">
        <i class="fas fa-upload"></i>{{'Import' | translate}}
      </label>
    </span>
  </div>
  @if (showAddTemplate) {
    <div class="row">
      <div ngForm="newTemplate" #newTemplate="ngForm" class="addTemplate col-md-6">
        <div class="form-group">
          <label for="new-template-label">
            <span>{{ 'Label' | translate }}</span>
            <span class="text-danger" ngbTooltip="{{'This field is mandatory' | translate}}">*</span>
          </label>
          <div [ngClass]="{'is-invalid': newTemplate.form.get('new_template.label')?.errors?.['required']}">
            <input id="new-template-label" name="new_template.label" class="form-control" [(ngModel)]="new_template.label" type="text" required />
          </div>
        </div>
        <div class="form-group">
          <button id="add-btn" class="btn btn-primary" [disabled]="newTemplate.invalid" (click)="addTemplate(); toggleAddTemplate()" type="submit">
            <i class="fas fa-plus"></i>
            <span>{{ 'Add' | translate }}</span>
          </button>
        </div>
      </div>
    </div>
  }
  <app-paginated-interface [items]="templatesData" [filterField]="'label'">
      <ng-template #content let-item="item" let-index="index">
        <div class="templateList">
          <form id="template-{{index}}" name="editTemplate" #editTemplate="ngForm" novalidate>
            <src-statistical-template-editor [templateData]="item" [templatesData]="templatesData" [editTemplate]="editTemplate" [index]="index" (dataToParent)="onTemplateRemoved($event)"></src-statistical-template-editor>
          </form>
        </div>
    </ng-template>
  </app-paginated-interface>
</div>
