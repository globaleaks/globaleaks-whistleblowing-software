<div class="config-section reveal">
  <div>
    <span>{{ 'Templates' | translate }}</span>
    <button class="btn btn-sm btn-primary show-add-template-btn" (click)="toggleAddTemplate()">
      <i class="fas fa-plus"></i>
      <span>{{ 'Add' | translate }}</span>
    </button>
  </div>
  <div class="row mb-3">
    <div class="col d-flex justify-content-end">
      <div class="input-group input-group-sm w-auto">
        <input type="text" class="form-control" placeholder="{{ 'Search' | translate }}" [(ngModel)]="searchTerm" (input)="onSearchChange()">
        <span class="input-group-text">
          <i class="fas fa-search"></i>
        </span>
      </div>
    </div>
  </div>
  @if (showAddTemplate) {
    <div class="row">
      <div ngForm="newTemplate" #newTemplate="ngForm" class="addTemplate col-md-6">
        <div class="form-group">
          <label>
            <span>{{ 'Label' | translate }}</span>
            <span class="text-danger" ngbTooltip="{{'This field is mandatory' | translate}}">*</span>
          </label>
          <div [ngClass]="{'is-invalid': newTemplate.form?.get('new_template.label')?.errors?.['required']}">
            <input id="new-template-label" name="new_template.label" class="form-control" [(ngModel)]="new_template.label" type="text" required />
          </div>
        </div>
        <div class="form-group">
          <button id="add-btn" class="btn btn-primary" [disabled]="newTemplate.invalid" (click)="addTemplate(); toggleAddTemplate()" type="submit">
            <i class="fas fa-plus"></i>
            <span>{{ 'Add' | translate }}</span>
          </button>
        </div>
      </div>
    </div>
  }
  @if (templatesData.length) {
    @for (template of filteredTemplatesData; track template.id; let index = $index) {
      <div class="templateList">
        <form id="template-{{index}}" name="editTemplate" #editTemplate="ngForm" novalidate>
          <src-statistical-template-editor [templateData]="template" [templatesData]="templatesData" [editTemplate]="editTemplate" [filterOptions]="filterOptions" [index]="index"></src-statistical-template-editor>
        </form>
      </div>
    }
  }
</div>
