<div class="reportDetail">
  <div class="d-flex justify-content-end mb-2">
    <button type="button" class="downloadButton btn btn-sm btn-outline-secondary" data-action="export" (click)="exportReportAsPDF()">
      <i class="fa-solid fa-file-export"></i>
      <span>{{ 'Export' | translate }}</span>
    </button>
  </div>
  @if (hasObservation()) {
    <div id="StatisticsObservation" class="row mb-3 filter-section statistics-filter-bar">
      <div class="col-12 d-flex flex-wrap align-items-center gap-2">
        @if (observationDateRange) {
          <span class="badge bg-secondary">
            <i class="fas fa-calendar me-1"></i>
            {{ observationDateRange.fromDate | date:'dd-MM-yyyy' }} - {{ observationDateRange.toDate | date:'dd-MM-yyyy' }}
          </span>
        }
        @for (channel of observationChannels; track channel) {
          <span class="badge bg-secondary">
            <i class="fas fa-filter me-1"></i>
            {{ channel }}
          </span>
        }
      </div>
    </div>
  }
  @if (selectedTemplate) {
    <src-statistical-template-view [templateData]="selectedTemplate" [templatesData]="templatesData" [statisticsData]="viewData"></src-statistical-template-view>
  }
</div>
