<div class="config-section reveal">
  @if (filterOptions) {
  <app-paginated-interface [mode]="'table'" [hoverRows]="true" [items]="table.result" [itemsPerPage]="20"
    [orderBy]="table.orderBy" [orderDesc]="table.orderDesc">
    <ng-template #toolbar>
      <button class="btn btn-sm btn-primary show-add-report-btn" (click)="toggleAddReport()">
        <i class="fas fa-plus"></i>
        <span>{{ 'Create' | translate }}</span>
      </button>
    </ng-template>
    <ng-template #addForm>
  @if (showAddReport) {
    <div class="row">
      <div ngForm="newReport" #newReport="ngForm" class="addReport col-md-6">
        <div class="form-group">
          <label>
            <span>{{ 'Label' | translate }}</span>
            <span class="text-danger" ngbTooltip="{{'This field is mandatory' | translate}}">*</span>
          </label>
          <div [ngClass]="{'is-invalid': newReport.form.get('new_report.label')?.errors?.['required']}">
            <input id="new-report-label" name="new_report.label" class="form-control" [(ngModel)]="new_report.label" type="text" required />
          </div>
        </div>
        <div class="form-group">
          <label>
            <span>{{ 'Template' | translate }}</span>
            <span class="text-danger" ngbTooltip="{{'This field is mandatory' | translate}}">*</span>
          </label>
          <div [ngClass]="{'is-invalid': newReport.form.get('new_report.template_id')?.errors?.['required']}">
            <select id="new-report-template-id" name="new_report.template_id" class="form-control" [(ngModel)]="new_report.template_id" required>
              @for (template of templatesData; track template.id) {
                <option [value]="template.id">{{ template.label }}</option>
              }
            </select>
          </div>
        </div>
        <div class="form-group">
          <div id="ReportObservationFilter" class="statistics-filter-bar d-flex flex-wrap align-items-center gap-2">
            <span class="ngb-datepicker-container" (click)="$event.stopPropagation()">
              <button data-cy="filter_date_button" type="button" class="btn btn-sm btn-outline-secondary"
                [ngClass]="{'filter-active': dateFilter}" (click)="datePicker=!datePicker; closeOtherDropdowns('date')"
                ngbTooltip="{{ dateFilter ? ((dateFilter.fromDate | date:'dd-MM-yyyy') + ' - ' + (dateFilter.toDate | date:'dd-MM-yyyy')) : ('Date range' | translate) }}">
                <i class="fas fa-calendar me-1"></i>
                @if (dateFilter) {
                  <span>{{ dateFilter.fromDate | date:'dd-MM-yyyy' }} - {{ dateFilter.toDate | date:'dd-MM-yyyy' }}</span>
                } @else {
                  <span>{{ 'Date range' | translate }}</span>
                }
              </button>
              <div [hidden]="!datePicker" (click)="$event.stopPropagation()">
                <src-date-selector class="position-absolute d-block" [currentDates]="dateModel" (emitDateSelection)="onDateFilterChange($event)">
                </src-date-selector>
              </div>
            </span>

            <span class="dropdown-multi-select-container" (click)="$event.stopPropagation()">
              <button type="button" class="btn btn-sm btn-outline-secondary" [ngClass]="{'filter-active': channelFilterActive}"
                (click)="toggleChannelFilter(); closeOtherDropdowns('channel')" ngbTooltip="{{ getFilterTooltip() }}">
                <i class="fas fa-filter me-1"></i>
                <span>{{ getFilterDisplayText() }}</span>
                @if (channelDropdownModel.length > 0) {
                  <span class="badge bg-primary ms-1">{{ channelDropdownModel.length }}</span>
                }
              </button>
              <span [class.d-none]="!channelDropdownVisible" (click)="$event.stopPropagation()">
                <ng-multiselect-dropdown [class.dropdown-visible]="channelDropdownVisible" [settings]="channelDropdownSettings" [data]="channelDropdownData" [(ngModel)]="channelDropdownModel" [ngModelOptions]="{standalone: true}" (onSelect)="onChannelFilterChange()" (onDeSelect)="onChannelFilterChange()">
                </ng-multiselect-dropdown>
              </span>
            </span>

            @if (hasActiveFilters()) {
              <button data-cy="filter_clear_button" type="button" class="btn btn-sm btn-outline-danger" (click)="clearObservationFilters()">
                <i class="fas fa-times me-1"></i>
                {{ 'Clear' | translate }}
              </button>
            }
          </div>
        </div>
        <div class="form-group">
          <button id="add-btn" class="btn btn-primary" [disabled]="newReport.invalid" (click)="addReport(); toggleAddReport()" type="submit">
            <i class="fas fa-plus"></i>
            <span>{{ 'Add' | translate }}</span>
          </button>
        </div>
      </div>
    </div>
  }
    </ng-template>
    <ng-template #header>
      <tr>
        <th appTableHeader [state]="table" [label]="'Creation date' | translate" sortBy="creation_date" filter="creation_date"></th>
        <th appTableHeader [state]="table" [label]="'Title' | translate" sortBy="label"></th>
        <th appTableHeader [state]="table" [label]="'Template' | translate" sortBy="template" filter="template" [options]="templateOptions"></th>
        <th></th>
      </tr>
    </ng-template>
    <ng-template #content let-row="item" let-index="index">
      <tr class="reportList expandable-row" [attr.data-cy]="'statistical-report-' + index"
        [class.expandable-row-open]="expandedReportId === row.id" (click)="onRowClick(row, $event)">
        <td>{{ row.creation_date | date:'dd-MM-yyyy HH:mm' }}</td>
        <td>{{ row.label }}</td>
        <td>{{ row.template }}</td>
        <td class="text-end">
          <button type="button" class="btn btn-sm btn-danger" name="delete_report" id="delete_report" (click)="deleteReport(row)">
            <span>{{ 'Delete' | translate }}</span>
          </button>
          <button type="button" class="btn btn-sm btn-outline-secondary ms-1" id="edit_report" data-cy="toggle-statistical-report"
            [attr.aria-expanded]="expandedReportId === row.id"
            [attr.aria-label]="(expandedReportId === row.id ? 'Collapse' : 'Expand') | translate" (click)="toggleReport(row)">
            @if (expandedReportId === row.id) {
              <i class="fas fa-chevron-up" aria-hidden="true"></i>
            } @else {
              <i class="fas fa-chevron-down" aria-hidden="true"></i>
            }
          </button>
        </td>
      </tr>
      @if (expandedReportId === row.id) {
        <tr class="expandable-detail" data-cy="statistical-report-details">
          <td [attr.colspan]="columnCount">
            <div class="expandable-box">
              <src-statistical-report-editor [reportData]="row.report" [index]="index"></src-statistical-report-editor>
            </div>
          </td>
        </tr>
      }
    </ng-template>
  </app-paginated-interface>
  }
</div>
