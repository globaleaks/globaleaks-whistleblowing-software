<div class="config-item">
  <div class="editorHeader row">
    <span class="col-md-7" (click)="toggleEditing()">
      <span>{{ templateData.label }} - {{ templateData.creation_date | date:'dd-MM-yyyy HH:mm' }}</span>
    </span>
    <span class="col-md-5 clearfix">
      <span class="float-end">
        @if (!editing) {
          <button class="btn btn-sm btn-outline-secondary" id="edit_template" (click)="toggleEditing()">
            <span>{{ 'Edit' | translate }}</span>
          </button>
        }
        @if (editing) {
          <button class="btn btn-sm btn-primary" id="save_template" [disabled]="editTemplate.invalid" (click)="saveTemplate(templateData);toggleEditing()">
            <span>{{ 'Save' | translate }}</span>
          </button>
          <button class="btn btn-sm btn-outline-secondary" (click)="toggleEditing()">
            <span>{{ 'Cancel' | translate }}</span>
          </button>
        }
        <button class="btn btn-sm btn-danger" name="delete_template" id="delete_template" (click)="deleteTemplate(templateData)">
          <span>{{ 'Delete' | translate }}</span>
        </button>
      </span>
    </span>
  </div>
  @if (editing) {
    <div>
      <div class="form-group">
        <label>{{ 'Label' | translate }}</label>
        <input type="text" class="form-control" [(ngModel)]="templateData.label" name="label" />
      </div>
    </div>
    <div id="StatisticsFilter" class="row mb-3 filter-section statistics-filter-bar">
      <div class="col-12 d-flex flex-wrap align-items-center gap-2">
        <span class="ngb-datepicker-container" (click)="$event.stopPropagation()">
          <button data-cy="filter_date_button" type="button" class="btn btn-sm btn-outline-secondary"
            [ngClass]="{'filter-active': dateFilter}" (click)="datePicker=!datePicker; closeOtherDropdowns('date')"
            ngbTooltip="{{ dateFilter ? ((dateFilter.fromDate | date:'dd-MM-yyyy') + ' - ' + (dateFilter.toDate | date:'dd-MM-yyyy')) : ('Date Range' | translate) }}">
            <i class="fas fa-calendar me-1"></i>
            @if (dateFilter) {
              <span>{{ dateFilter.fromDate | date:'dd-MM-yyyy' }} - {{ dateFilter.toDate | date:'dd-MM-yyyy' }}</span>
            } @else {
              <span>{{ 'Date Range' | translate }}</span>
            }
          </button>
          <div [hidden]="!datePicker" (click)="$event.stopPropagation()">
            <ngbd-datepicker-range class="position-absolute d-block" [currentDates]="dateModel" (emitDateSelection)="onDateFilterChange($event)">
            </ngbd-datepicker-range>
          </div>
        </span>

        <span class="dropdown-multi-select-container" (click)="$event.stopPropagation()">
          <button type="button" class="btn btn-sm btn-outline-secondary" [ngClass]="{'filter-active': channelFilterActive}"
            (click)="toggleChannelFilter(); closeOtherDropdowns('channel')" ngbTooltip="{{ getFilterTooltip('channel') }}">
            <i class="fas fa-filter me-1"></i>
            <span>{{ getFilterDisplayText('channel') }}</span>
            @if (channelDropdownModel.length > 0) {
              <span class="badge bg-primary ms-1">{{ channelDropdownModel.length }}</span>
            }
          </button>
          <span [class.d-none]="!channelDropdownVisible" (click)="$event.stopPropagation()">
            <ng-multiselect-dropdown [class.dropdown-visible]="channelDropdownVisible" [settings]="channelDropdownSettings" [data]="channelDropdownData" [(ngModel)]="channelDropdownModel" (onSelect)="onChannelFilterChange()" (onDeSelect)="onChannelFilterChange()">
            </ng-multiselect-dropdown>
          </span>
        </span>

        @if (hasActiveFilters()) {
          <button data-cy="filter_clear_button" type="button" class="btn btn-sm btn-outline-danger" (click)="clearAllFilters()">
            <i class="fas fa-times me-1"></i>
            {{ 'Clear' | translate }}
          </button>
        }
      </div>
    </div>
    <div id="Content">
      <src-statistical-template-view 
        [templateData]="templateData" 
        [templatesData]="templatesData"
        [refreshKey]="filterRevision"
        [editable]="true"
        (removeMetric)="removeMetric($event)"
        (addNewMetric)="addNewMetric()"
        (manageMetric)="manageMetric($event)">
      </src-statistical-template-view>
    </div>
  }
</div>
