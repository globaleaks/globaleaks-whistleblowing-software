@for (row of rows; track row; let fieldRow = $index) {
  <div class="row">
    @for (field of row | orderBy:'x'; let fieldCol = $index; track $index) {
      @if (field?.enabled) {
        <div [class]="fieldUtilitiesService.getClass(field, row.length)">
          <src-form-field-inputs [fileUploadUrl]="fileUploadUrl()" (notifyFileUpload)="notifyFileUpload.emit($event)" [fieldEntry] = fieldEntry() [uploads]="uploads()" [entry]="entry()" [fields]="fields" [step]="step()" [displayErrors]="displayErrors()" [index]="index()" [submission]="submission()" [answers]="answers()" [stepId]="stepId" [fieldCol]="fieldCol" [fieldRow]="fieldRow" [field]="field"></src-form-field-inputs>
        </div>
      }
    }
  </div>
}
