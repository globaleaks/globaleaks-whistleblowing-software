<form name="notificationForm" #notificationForm="ngForm" novalidate class="reveal">
  <src-tabs>
    <ng-template srcTab="settings" title="Settings">
      <src-notification-tab1 [notificationForm]="notificationForm"></src-notification-tab1>
    </ng-template>
    <ng-template srcTab="templates" title="Templates">
      <src-notification-tab2 [notificationForm]="notificationForm"></src-notification-tab2>
    </ng-template>
    <ng-template srcTab="smtp" title="SMTP">
      <src-notification-tab3 [notificationForm]="notificationForm"></src-notification-tab3>
    </ng-template>
  </src-tabs>
</form>
