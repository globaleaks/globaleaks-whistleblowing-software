<div class="submissionStatusList">
  <div ngForm="editsubmissionStatus" #editsubmissionStatus="ngForm">
    <src-list-item class="submissionStatus" [(editing)]="editing" [canEdit]="isEditable(submissionsStatus())" [canDelete]="!isSystemDefined(submissionsStatus())" [saveDisabled]="!!editsubmissionStatus.invalid" (save)="saveSubmissionsStatus(submissionsStatus())" (deleted)="deleteSubmissionStatus(submissionsStatus())">
      <ng-container title>
        <span id="status-{{submissionsStatus().id}}">{{ submissionsStatus().label ? (submissionsStatus().label | translate) : '' }}</span>
      </ng-container>
      <ng-container actions>
        <button type="button" class="btn btn-sm btn-primary" data-action="move-up" (click)="moveUp($event, index())" ngbTooltip="{{'Move up' | translate}}" [attr.aria-label]="'Move up' | translate" [disabled]="first() || submissionsStatus().id === 'closed'">
          <i class="fas fa-chevron-up"></i>
        </button>
        <button type="button" class="btn btn-sm btn-primary" data-action="move-down" (click)="moveDown($event, index())" ngbTooltip="{{'Move down' | translate}}" [attr.aria-label]="'Move down' | translate" [disabled]="last() || ['new', 'opened'].indexOf(submissionsStatus().id) === -1">
          <i class="fas fa-chevron-down"></i>
        </button>
      </ng-container>
      <ng-template #body>
        <div class="row">
          @if (!isSystemDefined(submissionsStatus())) {
            <div class="col-md-6">
              <div class="form-group">
                <label for="submission-status-label-{{submissionsStatus().id}}">{{'Label'|translate}}</label>
                <input id="submission-status-label-{{submissionsStatus().id}}" name="name" class="form-control" [(ngModel)]="submissionsStatus().label" [disabled]="submissionsStatus().system_defined" type="text" required>
                @if (editsubmissionStatus?.errors?.['required']) {
                  <div class="text-danger">{{'This field is mandatory'|translate}}</div>
                }
              </div>
            </div>
          }
          <div class="col-md-12">
            <src-substatuses [submissionsStatus]="submissionsStatus()" (deleted)="onDelete($event)"></src-substatuses>
          </div>
        </div>
      </ng-template>
    </src-list-item>
  </div>
</div>
