<div id="AdminHomepage" class="reveal">
  <src-tabs>
    <ng-template srcTab="home" title="Home">
      <src-user-home></src-user-home>
    </ng-template>
    <ng-template srcTab="changelog" title="Changelog" [icon]="nodeResolver.dataModel.update_available ? 'fas fa-circle-exclamation text-danger' : ''">

    <ng-template srcTab="license" title="License">
      <src-license></src-license>

  </src-tabs>
</div>
