<div class="row">
  <div class="col-md-12">
    <div class="form-group">
      <label>
        <input id="antivirus-enabled" data-cy="antivirus-enabled" class="form-check-input" name="antivirus_enabled" [(ngModel)]="nodeResolver.dataModel.antivirus_enabled" type="checkbox" />
        <span>{{ 'Enable virus scanning of files' | translate }}</span>
      </label>
    </div>
    @if (nodeResolver.dataModel.antivirus_enabled) {
      <div class="form-group">
        <label for="antivirus-clamd-ip">{{ 'Host' | translate }}</label>
        <input id="antivirus-clamd-ip" name="antivirus_clamd_ip" class="form-control" [(ngModel)]="nodeResolver.dataModel.antivirus_clamd_ip" type="text" />
      </div>
      <div class="form-group">
        <label for="antivirus-clamd-port">{{ 'Port' | translate }}</label>
        <input id="antivirus-clamd-port" name="antivirus_clamd_port" class="form-control" [(ngModel)]="nodeResolver.dataModel.antivirus_clamd_port" type="number" min="1" max="65535" />
      </div>
    }
    <div class="form-group">
      <button id="save_antivirus_settings" data-cy="save-antivirus-settings" class="btn btn-primary" (click)="save()" type="button">{{ 'Save' | translate }}</button>
    </div>
  </div>
</div>
