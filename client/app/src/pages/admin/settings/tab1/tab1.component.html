<div class="row">
  <div class="col-md-6">
    <!-- The logo of each theme in a tab: the sun and the moon together while one logo serves both,
         the moon dim; once the dark theme has a logo of its own the sun and the moon part, until
         that logo is deleted -->
    <div class="form-group logo-themes">
      <label>{{ 'Logo' | translate }}</label>
      <ul class="nav nav-tabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button type="button" class="nav-link" role="tab" id="logo-tab-light" aria-controls="logo-panel-light"
                  [class.active]="logoTab === 'light'" [attr.aria-selected]="logoTab === 'light'" (click)="logoTab = 'light'"
                  [attr.aria-label]="(nodeResolver.dataModel.logo_dark ? 'Light theme' : 'Light and dark theme') | translate">
            <i class="fa-solid fa-sun" aria-hidden="true"></i>
            @if (!nodeResolver.dataModel.logo_dark) {
              <i class="fa-solid fa-moon" aria-hidden="true"></i>
            }
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button type="button" class="nav-link" role="tab" id="logo-tab-dark" aria-controls="logo-panel-dark"
                  [class.active]="logoTab === 'dark'" [class.logo-tab-unset]="!nodeResolver.dataModel.logo_dark" [attr.aria-selected]="logoTab === 'dark'" (click)="logoTab = 'dark'"
                  [attr.aria-label]="'Dark theme' | translate">
            <i class="fa-solid fa-moon" aria-hidden="true"></i>
          </button>
        </li>
      </ul>
      <div id="logo-panel-light" role="tabpanel" aria-labelledby="logo-tab-light" [class.d-none]="logoTab !== 'light'">
        <div appImageUpload [imageUploadModel]="nodeResolver.dataModel" [imageUploadModelAttr]="'logo'" [imageUploadId]="'logo'"></div>
      </div>
      <div id="logo-panel-dark" class="logo-dark-upload" role="tabpanel" aria-labelledby="logo-tab-dark" [class.d-none]="logoTab !== 'dark'">
        <div appImageUpload [imageUploadModel]="nodeResolver.dataModel" [imageUploadModelAttr]="'logo_dark'" [imageUploadId]="'logo-dark'"></div>
      </div>
    </div>
    @if (authenticationService.session?.role === 'admin') {
      <src-colors></src-colors>
    }
    <div class="form-group">
      <label for="project-name-input">{{ 'Project name' | translate }}</label>
      <input id="project-name-input" name="node.dataModel.name" class="form-control" [(ngModel)]="nodeResolver.dataModel.name" type="text" required />
    </div>
    <div class="form-group">
      <label for="node-description">{{ 'Description' | translate }}</label>
      <div>
        <textarea id="node-description" name="node.dataModel.description" class="form-control" [(ngModel)]="nodeResolver.dataModel.description"></textarea>
      </div>
    </div>
    <div class="form-group">
      <label for="node-header-title">{{ 'Homepage title' | translate }}</label>
      <div>
        <textarea id="node-header-title" class="form-control" name="node.dataModel.header_title_homepage" [(ngModel)]="nodeResolver.dataModel.header_title_homepage"></textarea>
      </div>
    </div>
    <div class="form-group">
      <label for="node-presentation">{{ 'Presentation' | translate }}</label>
      <div>
        <textarea id="node-presentation" class="form-control" name="node.dataModel.presentation" [(ngModel)]="nodeResolver.dataModel.presentation"></textarea>
      </div>
    </div>
    @if (authenticationService.session?.role === 'admin') {
      <div class="form-group">
        <label for="node-whistleblowing-question">{{ 'Question' | translate }}</label>
        <div>
          <textarea id="node-whistleblowing-question" name="node.dataModel.whistleblowing_question" class="form-control" [(ngModel)]="nodeResolver.dataModel.whistleblowing_question"></textarea>
        </div>
      </div>
    }
    @if (authenticationService.session?.role === 'admin') {
      <label>{{ 'Button' | translate }}</label>
      <div class="ms-4">
        <div class="form-group">
          <label for="whistleblowing-button-input">{{ 'Text' | translate }}</label>
          <input id="whistleblowing-button-input" name="nodeResolver.dataModel.whistleblowing_button" class="form-control" [(ngModel)]="nodeResolver.dataModel.whistleblowing_button" type="text" />
        </div>
        <div class="form-group">
          <label for="whistleblowing-destination-select">{{ 'Destination' | translate }}</label>
          <select id="whistleblowing-destination-select" class="form-select-custom" name="nodeResolver.dataModel.whistleblowing_destination" [(ngModel)]="nodeResolver.dataModel.whistleblowing_destination">
            <option value="/submission">/submission</option>
            <option value="/login">/login</option>
          </select>
        </div>
      </div>
    }
    <div class="form-group">
      <label for="node-disclaimer-text">{{ 'Disclaimer' | translate }}</label>
      <div>
        <textarea id="node-disclaimer-text" name="nodeResolver.dataModel.disclaimer_text" class="form-control" [(ngModel)]="nodeResolver.dataModel.disclaimer_text"></textarea>
      </div>
    </div>
    <div class="form-group">
      <label for="footer-whistleblowing-policy">{{'Whistleblowing Policy'|translate}}</label>
      <input id="footer-whistleblowing-policy" name="footer_whistleblowing_policy" class="form-control" [(ngModel)]="nodeResolver.dataModel.footer_whistleblowing_policy" [pattern]="Constants.secureLocalUrlRegexp" [class.is-invalid]="contentForm().form.get('footer_whistleblowing_policy')?.errors?.['pattern']" type="text" />
    </div>
    <div class="form-group">
      <label for="footer-privacy-policy">{{'Privacy Policy'|translate}}</label>
      <input id="footer-privacy-policy" name="footer_privacy_policy" class="form-control" [(ngModel)]="nodeResolver.dataModel.footer_privacy_policy" [pattern]="Constants.secureLocalUrlRegexp" [class.is-invalid]="contentForm().form.get('footer_privacy_policy')?.errors?.['pattern']" type="text" />
    </div>
    <div class="form-group">
      <label for="node-footer">{{ 'Footer' | translate }}</label>
      <div>
        <textarea id="node-footer" name="nodeResolver.dataModel.footer" class="form-control" [(ngModel)]="nodeResolver.dataModel.footer"></textarea>
      </div>
    </div>
    <div class="form-group">
      <button class="btn btn-primary" id="save_settings" [disabled]="contentForm().invalid" (click)="updateNode()" type="submit">
        <i class="fa-solid fa-floppy-disk"></i>
        <span>{{ 'Save' | translate }}</span>
      </button>
    </div>
  </div>
</div>
