<div class="reveal">
  <app-paginated-interface [items]="questionnairesData()" [filterField]="'name'" [orderBy]="'name'">
    <ng-template #toolbar>
      <button class="btn btn-primary show-add-questionnaire-btn" (click)="toggleAddQuestionnaire()">
        <i class="fas fa-plus"></i>
        <span>{{ 'Add' | translate }}</span>
      </button>
      <span class="custom-file">
        <input id="import-questionnaire-file" type="file" hidden #keyUploadInput (change)="importQuestionnaire(keyUploadInput.files)" />
        <label for="import-questionnaire-file" id="keyUpload" class="btn btn-outline-secondary">
          <i class="fas fa-upload"></i>{{'Import' | translate}}
        </label>
      </span>
    </ng-template>
    <ng-template #addForm>
      @if (showAddQuestionnaire) {
        <div class="config-section row">
          <form id="newQuestionnaire" #newQuestionnaire="ngForm" class="addQuestionnaire col-md-6" novalidate>
            <div class="form-group">
              <label for="new-questionnaire-name">
                <span>{{ 'Name' | translate }}</span>
                <span class="text-danger" ngbTooltip="{{'This field is mandatory' | translate}}">*</span>
              </label>
              <div>
                <input id="new-questionnaire-name" name="new_questionnaire.name" class="form-control" [(ngModel)]="new_questionnaire.name" type="text" [class.is-invalid]="newQuestionnaire.form.get('new_questionnaire.name')?.errors?.['required']" required />
              </div>
            </div>
            <div class="form-group">
              <button id="add-questionnaire-btn" class="btn btn-primary" [disabled]="newQuestionnaire.invalid" (click)="addQuestionnaire(); toggleAddQuestionnaire()" type="button">
                <i class="fas fa-plus"></i>
                <span>{{ 'Add' | translate }}</span>
              </button>
            </div>
          </form>
        </div>
      }
    </ng-template>
      <ng-template #content let-item="item" let-index="index">
        <form id="questionnaire-{{index}}" #editQuestionnaire="ngForm" novalidate>
          <src-questionnaires-list [questionnaire]="item" [editQuestionnaire]="editQuestionnaire" [questionnaires]="questionnairesData()" (duplicated)="getResolver()" (deleted)="onDelete($event)"></src-questionnaires-list>
        </form>
      </ng-template>
  </app-paginated-interface>
</div>
