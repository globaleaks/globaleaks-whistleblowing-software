variables:
  SONAR_HOST_URL: 'http://quality.lab.anticorruzione.local/'
  SONAR_PROJECT_KEY: 'Whistleblowing_2025'
  SONAR_TOKEN: '73f220ba3d9c75d1bb4cde9c91b83405b1e5d56f'

stages:
  - verify

sonarqube:
  stage: verify
  image:
    name: sonarsource/sonar-scanner-cli:4.8.1
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
      -Dsonar.host.url=${SONAR_HOST_URL}
      -Dsonar.projectKey=${SONAR_PROJECT_KEY}
      -Dsonar.login=${SONAR_TOKEN}
      -Dsonar.sources=.
      -Dsonar.qualitygate.wait=true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG