version: '3.9'

services:
  globaleaks:
    environment:
      DISTRIBUTION: trixie
    build:
      context: .
      args:
        BASE_IMAGE: debian:trixie-slim@sha256:28de0877c2189802884ccd20f15ee41c203573bd87bb6b883f5f46362d24c5c2
        DISTRIBUTION: trixie
    restart: unless-stopped
    container_name: globaleaks
    network_mode: host
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run/globaleaks:mode=1777
      - /tmp:mode=1777
    volumes:
      - globaleaks:/var/globaleaks:rw
    ports:
      - 80:8080
      - 443:8443
      - 8080:8080
      - 8443:8443
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:8443/api/health"]
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  globaleaks: {}
